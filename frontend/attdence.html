<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>
</head>

<body>

    <main>

        <!-- Page Header -->
        <section>
            <h1>Attendance</h1>

            <p>
                Track and manage your daily attendance
            </p>
        </section>


        <!-- Attendance Section -->
        <section>

            <h2>Today's Attendance</h2>

            <p id="status">Not Checked In</p>

            <p id="checkInTime">--:--</p>

            <p id="checkOutTime">--:--</p>

            <!-- Check In / Check Out -->
            <div>

                <button id="checkIn">
                    Check In
                </button>

                <button id="checkOut">
                    Check Out
                </button>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
